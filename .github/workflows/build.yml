name: SolarXiao Advanced E22P 2.8.1
on:
  push:
    branches: [main]
    paths: [.github/workflows/build.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out pinned official firmware
        uses: actions/checkout@v4
        with:
          repository: meshtastic/firmware
          ref: 8e6a88d06f44cad26f1e8d7cd402939ccacb9b4c
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure SolarXiao Advanced Plus
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          src = Path("variants/nrf52840/seeed_xiao_nrf52840_kit")
          dst = src
          dst.mkdir(parents=True, exist_ok=True)
          h = (src / "variant.h").read_text()
          replacements = {
              "#define USE_SX1262": "#define USE_SX1262\n// E22P: Spicy E22P mapping: 8 dB PA allowance, 22 dBm chip cap; RF output unmeasured.\n#define TX_GAIN_LORA 8\n#define SX126X_MAX_POWER 22",
              "#define SX126X_RXEN D5": "#define SX126X_RXEN RADIOLIB_NC",
              "#define GPS_L76K": "// Generic UART GPS; no L76K-specific defaults.",
              "#define PIN_GPS_STANDBY D0": "#define PIN_GPS_EN D0\n#define GPS_EN_ACTIVE 1",
          }
          for old, new in replacements.items():
              assert h.count(old) == 1, f"Unexpected upstream definition: {old}"
              h = h.replace(old, new)
          (dst / "variant.h").write_text(h)
          cpp = (src / "variant.cpp").read_text()
          cpp += '\nstatic_assert(GPS_TX_PIN == 6 && GPS_RX_PIN == 7, "GPS pin mismatch");\n'
          cpp += 'static_assert(PIN_WIRE_SDA == 30 && PIN_WIRE_SCL == 31, "I2C pin mismatch");\n'
          cpp += '#ifdef PIN_GPS_STANDBY\n#error "GPS enable must not also be assigned as standby"\n#endif\n'
          cpp += 'static_assert(HW_VENDOR == meshtastic_HardwareModel_XIAO_NRF52_KIT, "Hardware ID mismatch");\n'
          cpp += 'static_assert(TX_GAIN_LORA == 8 && SX126X_MAX_POWER == 22, "PA settings mismatch");\n'
          cpp += 'static_assert(PIN_GPS_EN == D0 && GPS_EN_ACTIVE == 1, "GPS enable mismatch");\n'
          (dst / "variant.cpp").write_text(cpp)
          # GPIO 0 is valid on XIAO; upstream's truthiness check treats it as absent.
          gps_path = Path("src/gps/GPS.cpp")
          gps = gps_path.read_text()
          old = "    if (_en_gpio) {\n        GpioPin *p = new GpioHwPin(_en_gpio);"
          new = "#if defined(PIN_GPS_EN)\n    if (_en_gpio || PIN_GPS_EN == 0) {\n#else\n    if (_en_gpio) {\n#endif\n        GpioPin *p = new GpioHwPin(_en_gpio);"
          assert gps.count(old) == 1, "Unexpected GPS enable attachment"
          gps = gps.replace(old, new)
          gps_path.write_text(gps)
          ini = """[env:seeed_xiao_nrf52840_kit]
          extends = nrf52840_base
          board_level = extra
          board = xiao_ble_sense
          custom_meshtastic_hw_model = 88
          custom_meshtastic_hw_model_slug = XIAO_NRF52_KIT
          custom_meshtastic_architecture = nrf52840
          custom_meshtastic_display_name = Seeed Xiao NRF52840 Kit
          custom_meshtastic_support_level = 3
          build_flags = ${nrf52840_base.build_flags}
            -I variants/nrf52840/seeed_xiao_nrf52840_kit
            -I src/platform/nrf52/softdevice
            -I src/platform/nrf52/softdevice/nrf52
            -D SEEED_XIAO_NRF52840_KIT
            -D SEEED_XIAO_NRF_KIT_DEFAULT
            -D CONFIG_NFCT_PINS_AS_GPIOS=1
          board_build.ldscript = src/platform/nrf52/nrf52840_s140_v7.ld
          build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/seeed_xiao_nrf52840_kit>
          debug_tool = jlink
          """
          (dst / "platformio.ini").write_text(ini)
          PY
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Build firmware
        shell: bash
        run: |
          set -o pipefail
          pio run -e seeed_xiao_nrf52840_kit -j 4 2>&1 | tee build.log
      - name: Verify firmware blocks
        shell: bash
        run: |
          python - <<'PY' | tee uf2-validation.txt
          from pathlib import Path
          import struct, hashlib, json, zipfile, binascii
          files = list(Path(".pio/build/seeed_xiao_nrf52840_kit").glob("*.uf2"))
          assert len(files) == 1, files
          p = files[0]
          data = p.read_bytes()
          assert data and len(data) % 512 == 0
          addresses = set()
          lo, hi = 0xFFFFFFFF, 0
          for index in range(len(data) // 512):
              block = data[index*512:(index+1)*512]
              a,b,flags,addr,size,num,total,family = struct.unpack_from("<8I", block)
              assert (a,b) == (0x0A324655,0x9E5D5157)
              assert struct.unpack_from("<I",block,508)[0] == 0x0AB16F30
              assert flags & 0x2000 and family == 0xADA52840
              assert size == 256 and num == index and total == len(data)//512
              assert addr not in addresses
              addresses.add(addr)
              assert 0x27000 <= addr and addr+size <= 0xEA000
              lo,hi = min(lo,addr),max(hi,addr+size)
          assert lo == 0x27000
          print("Target: SolarXiao+ Advanced E22P, GPS D6/D7, I2C NFC1/NFC2")
          print("Base: official v2.8.1.8e6a88d")
          print("Blocks:", len(data)//512)
          print("Application range:", hex(lo), hex(hi))
          print("SHA256:",hashlib.sha256(data).hexdigest())
          print("Compiled and structurally checked; not hardware tested.")
          build = p.parent
          packages = list(build.glob("*.zip"))
          assert len(packages) == 1, packages
          with zipfile.ZipFile(packages[0]) as z:
              assert z.testzip() is None
              manifest = json.loads(z.read("manifest.json"))["manifest"]
              assert "application" in manifest and set(manifest) <= {"application", "dfu_version"}, manifest
              app = manifest["application"]
              image = z.read(app["bin_file"])
              init = z.read(app["dat_file"])
          dev_type, revision, app_version, sd_count = struct.unpack_from("<HHIH", init)
          required_sd = struct.unpack_from("<" + "H" * sd_count, init, 10)
          assert dev_type == 0x0052 and required_sd == (0x0123,), (dev_type, required_sd)
          assert len(init) == 12 + 2 * sd_count, len(init)
          assert struct.unpack_from("<H", init, 10 + 2 * sd_count)[0] == binascii.crc_hqx(image, 0xFFFF)
          assert 0x27000 + len(image) <= 0xEA000
          hex_files = list(build.glob("*.hex"))
          assert len(hex_files) == 1
          upper = 0
          hex_bytes = {}
          for line in hex_files[0].read_text().splitlines():
              record = bytes.fromhex(line[1:])
              assert sum(record) % 256 == 0
              count, address, kind = record[0], int.from_bytes(record[1:3], "big"), record[3]
              if kind == 4:
                  upper = int.from_bytes(record[4:6], "big") << 16
              elif kind == 2:
                  upper = int.from_bytes(record[4:6], "big") << 4
              elif kind == 0:
                  hex_bytes.update((upper + address + i, byte) for i, byte in enumerate(record[4:4+count]))
          assert min(hex_bytes) == 0x27000
          for address, byte in hex_bytes.items():
              assert image[address - 0x27000] == byte
          uf2_bytes = {}
          for index in range(len(data) // 512):
              block = data[index*512:(index+1)*512]
              addr, size = struct.unpack_from("<II", block, 12)
              for i, byte in enumerate(block[32:32+size]):
                  assert byte == hex_bytes.get(addr + i, 0)
                  uf2_bytes[addr + i] = byte
          assert all(uf2_bytes[address] == byte for address, byte in hex_bytes.items())
          metadata_files = list(build.glob("*.mt.json"))
          assert len(metadata_files) == 1
          metadata = json.loads(metadata_files[0].read_text())
          assert metadata["hwModel"] == 88
          assert metadata["hwModelSlug"] == "XIAO_NRF52_KIT"
          assert metadata["platformioTarget"] == "seeed_xiao_nrf52840_kit"
          release = Path("release")
          release.mkdir(exist_ok=True)
          shutil = __import__("shutil")
          shutil.copy2(p, release / p.name)
          ota_name = packages[0].stem + "-ota.zip"
          shutil.copy2(packages[0], release / ota_name)
          shutil.copy2(metadata_files[0], release / metadata_files[0].name)
          (release / "README.txt").write_text(
              "CUSTOM SOLARXIAO ADVANCED E22P firmware, reported as XIAO NRF KIT.\n"
              "UF2: USB application install. *-ota.zip: BLE application DFU update.\n"
              "S140 7.3.0 (0x0123); application begins at 0x27000.\n"
              "GPS D6/D7, active-high GPS enable D0, I2C 30/31, RXEN disconnected, PA gain 8 dB, chip cap 22 dBm.\n"
              "Normal mode requested 30 dBm maps to chip 22 dBm.\n"
              "Select CUSTOM/LOCAL firmware in updater; stock XIAO firmware lacks these settings.\n"
              "Built and structurally verified; BLE transfer and device operation not tested.\n"
          )
          hashes = [(file.name, hashlib.sha256(file.read_bytes()).hexdigest()) for file in sorted(release.iterdir()) if file.is_file() and not file.name.startswith(".")]
          (release / "SHA256SUMS.txt").write_text("".join(f"{sha}  {name}\n" for name, sha in hashes))
          print("Reported hardware: XIAO_NRF52_KIT (88)")
          print("Reported build target:", metadata["platformioTarget"])
          print("DFU application bytes:", len(image))
          print("DFU required SoftDevice:", [hex(sd) for sd in required_sd])
          print("DFU CRC16 and UF2/application equality: passed")
          print("BLE package:", ota_name)
          print("BLE ZIP SHA256:", hashlib.sha256(packages[0].read_bytes()).hexdigest())
          PY
      - name: Upload ready-to-install USB and BLE files
        uses: actions/upload-artifact@v4
        with:
          name: SolarXiao-2.8.1-XIAO-NRF-KIT-D0-GPS-USB-BLE
          path: release/
          if-no-files-found: error
      - name: Upload firmware and reproducible sources
        uses: actions/upload-artifact@v4
        with:
          name: SolarXiao-XIAO-NRF-KIT-D0-GPS-2.8.1-USB-and-BLE
          path: |
            release/
            .pio/build/seeed_xiao_nrf52840_kit/*.uf2
            .pio/build/seeed_xiao_nrf52840_kit/*.elf
            .pio/build/seeed_xiao_nrf52840_kit/*.hex
            variants/nrf52840/seeed_xiao_nrf52840_kit/
            src/gps/GPS.cpp
            build.log
            uf2-validation.txt
          if-no-files-found: error
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SolarXiao-build-failure-log
          path: |
            build.log
            uf2-validation.txt
            .pio/build/seeed_xiao_nrf52840_kit/*.uf2
            .pio/build/seeed_xiao_nrf52840_kit/*.hex
            .pio/build/seeed_xiao_nrf52840_kit/*.zip
            .pio/build/seeed_xiao_nrf52840_kit/*.mt.json
          include-hidden-files: true
          if-no-files-found: ignore
